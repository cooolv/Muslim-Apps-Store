name: sync-telegram
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 telethon
      - run: python scripts/sync.py
        env: {CHANNEL: muslim_appss}
      - run: python scripts/files.py
        env:
          CHANNEL: muslim_appss
          GH_TOKEN: ${{ github.token }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name "store-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "sync $(date -u +%F_%T)" && git pull --rebase -q && git push)
          gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null 2>&1 || true
