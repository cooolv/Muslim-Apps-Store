name: sync-telegram
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
    inputs:
      refresh: {description: "إعادة فحص كل تاريخ القناة", type: boolean, default: false}
      dry_run: {description: "تجربة النشر بدون نشر فعلي", type: boolean, default: false}
permissions:
  contents: write
  pages: write
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 telethon pillow icoextract androguard
      - run: python scripts/sync.py
        env:
          CHANNEL: muslim_appss
          REFRESH: ${{ inputs.refresh && '1' || '' }}
      - run: python scripts/files.py
        continue-on-error: true
        env:
          CHANNEL: muslim_appss
          GH_TOKEN: ${{ github.token }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
      - run: python scripts/icons.py
        continue-on-error: true
      - name: commit data
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name "store-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "sync $(date -u +%F_%T)" && git pull --rebase -q && git push)
          gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null 2>&1 || true
      - name: publish to Facebook and Blogger
        continue-on-error: true
        run: python scripts/publish.py
        env:
          CHANNEL: muslim_appss
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: commit publish state
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "publish state" && git pull --rebase -q && git push)
